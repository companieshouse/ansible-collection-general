---

- name: Prerequisite - Check if oracle user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ netapp_snapcenter_plugin_user }}"
  register: user

- name: Check if Netapp Snapcenter plugin is installed
  ansible.builtin.stat:
    path: "{{ netapp_snapcenter_plugin_snapcenter_path }}"
  register: snapcenter_plugin

- name: Install Netapp Snapcenter
  ansible.builtin.include_tasks: snapcenter.yml
  when: not snapcenter_plugin.stat.exists and user.exists
