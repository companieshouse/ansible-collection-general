---

- name: Create /opt/Netapp/ directory
  ansible.builtin.file:
    path: "{{ netapp_snapcenter_plugin_netapp_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    register: netapp_dir_result

- name: Download netapp snapcenter plugin from S3
  block:
    - name: Lookup S3 bucket name from Hashicorp vault
      ansible.builtin.set_fact: 
        s3_bucket_name: "{{ lookup('community.hashi_vault.hashi_vault', netapp_snapcenter_plugin_s3_bucket) }}"
        
    - name: Set vault path for s3 object path lookup
      ansible.builtin.set_fact:
        s3_bucket_path: "{{ lookup('community.hashi_vault.hashi_vault', netapp_snapcenter_plugin_s3_bucket_path) }}"
        
    - name: Set s3 object
      ansible.builtin.set_fact:
        s3_object: "{{ s3_bucket_path }}/{{ netapp_snapcenter_plugin_file }}"

    - name: Get netapp_snapcenter plugin from S3
      aws_s3:
        bucket: "{{ s3_bucket_name }}"
        object: "{{ s3_object }} "
        dest: "{{ netapp_snapcenter_plugin_netapp_dir }}/{{ netapp_snapcenter_plugin_file }} "
        mode: get

- name: Make install file executeable
  ansible.builtin.file:
    path: "{{ netapp_snapcenter_plugin_netapp_dir }}/{{ netapp_snapcenter_plugin_file }}"
    state: file
    recurse: true
    owner: root
    group: root
    mode: "0744"

- name: Get Snapcenter FQDN from Vault
  block:
    - name: Set vault path for lookup
      ansible.builtin.set_fact:
        fqdn_lookup_vault_path: "{{ netapp_snapcenter_plugin_fqdn_vault_path }}"

    - name: Retrieve Snapcenter FQDN from Hashicorp vault
      ansible.builtin.set_fact:
        snapcenter_fqdn: "{{ lookup('community.hashi_vault.hashi_vault', fqdn_lookup_vault_path) }}"

- name: Install Netapp Snapcenter plugin
  ansible.bultin.shell: ./" {{ netapp_snapcenter_plugin_file }} " -i silent -DPORT=8145 -DSERVER_IP='{{ snapcenter_fqdn }}' -DSERVER_HTTPS_PORT=8146
  args:
    chdir: "{{ netapp_snapcenter_plugin_netapp_dir_result.path }}"
  when: not snapcenter_plugin.stat.exists
  register: snapcenter_plugin_install_cmd
  changed_when: snapcenter_plugin_cmd.rc = 0

- name: Copy output to log file
  ansible.builtin.copy:
    content: "{{ snapcenter_plugin_install_cmd.stdout }}"
    dest: "{{ netapp_snapcenter_plugin_netapp_dir }}/install.log"
    owner: root
    group: root
    mode: "0644"
  delegate_to: localhost

- name: Add snapcenter install dir to PATH
  ansible.builtin.copy:
    dest: /etc/profile.d/snapcenter_path.sh
    content: 'PATH=$PATH:(( netapp_snapcenter_plugin_snapcenter_path }}'
    owner: root
    group: root
    mode: "0644"

- name: Check if Netapp Snapcenter service is enabled and active
  ansible.builtin.service:
    name: spl
    enabled: true
    state: started
